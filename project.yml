name: DarraOwl
options:
  bundleIdPrefix: com.darrao.darraowl
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S3YD258U2R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    # The Mac app's version (GitHub releases), apart from the iPhone's: a
    # local build carries the last released one, so the updater does not
    # replace it with that release.
    MAC_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  DarraOwlMacPackage:
    path: mac
  DarraOwlShared:
    path: shared
  DarraOwlPhone:
    path: ios
targets:
  DarraOwlHelper:
    type: tool
    platform: macOS
    sources:
      - path: mac/Sources/DarraOwlHelper
    dependencies:
      - package: DarraOwlMacPackage
        product: DarraOwlHelperKit
    settings:
      base:
        PRODUCT_NAME: DarraOwlHelper
        MARKETING_VERSION: $(MAC_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.mac.helper
        INFOPLIST_FILE: mac/Resources/Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # `darraowl`, the command line client. Embedded in Contents/Helpers; the
  # app links it into ~/.local/bin on request.
  DarraOwlCLI:
    type: tool
    platform: macOS
    sources:
      - path: mac/Sources/DarraOwlCLI
    dependencies:
      - package: DarraOwlMacPackage
        product: DarraOwlCLIKit
    settings:
      base:
        PRODUCT_NAME: darraowl
        MARKETING_VERSION: $(MAC_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.mac.cli
        INFOPLIST_FILE: mac/Resources/CLI/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  DarraOwlMac:
    type: application
    platform: macOS
    sources:
      - path: mac/Sources/DarraOwlMac
      - path: mac/Resources/App/Assets.xcassets
      # MIT: the notices travel with every copy of the app.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: mac/Resources/Helper/com.darrao.darraowl.mac.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: DarraOwlMacPackage
        product: DarraOwlMacUI
      - target: DarraOwlHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: DarraOwlCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: DarraOwl
        MARKETING_VERSION: $(MAC_VERSION)
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.mac
        INFOPLIST_FILE: mac/Resources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: mac/Resources/App/DarraOwl.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}

  DarraOwliOS:
    type: application
    platform: iOS
    sources:
      - path: ios/App
      - path: ios/Shared
      - path: ios/Resources/Assets.xcassets
      - path: ios/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: DarraOwlPhone
        product: DarraOwlPhoneKit
      - package: DarraOwlShared
      - target: DarraOwlWidgets
        embed: true
      - target: DarraOwlWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_NAME: DarraOwl
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl
        INFOPLIST_FILE: ios/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ios/Resources/DarraOwl.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: NO
    scheme: {}

  DarraOwlWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widgets
      - path: ios/Shared
    settings:
      base:
        PRODUCT_NAME: DarraOwlWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.widgets
        INFOPLIST_FILE: ios/Resources/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ios/Resources/Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  # Apple Watch: talks to the Mac through the iPhone (WatchConnectivity).
  DarraOwlWatch:
    type: application
    platform: watchOS
    sources:
      - path: watch/App
      - path: watch/Shared
      - path: ios/Shared/OwlShape.swift
      - path: watch/Resources/Assets.xcassets
    dependencies:
      - package: DarraOwlShared
      - target: DarraOwlWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: DarraOwl
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.watchkitapp
        INFOPLIST_FILE: watch/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: watch/Resources/DarraOwlWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
    scheme: {}

  DarraOwlWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: watch/Widgets
      - path: watch/Shared
      - path: ios/Shared/OwlShape.swift
    settings:
      base:
        PRODUCT_NAME: DarraOwlWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.darrao.darraowl.watchkitapp.widgets
        INFOPLIST_FILE: watch/Resources/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: watch/Resources/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
